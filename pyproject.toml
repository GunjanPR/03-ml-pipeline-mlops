[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ml-pipeline-mlops"
version = "0.1.0"
description = "End-to-end ML pipeline with MLflow, DVC, Evidently, Kubernetes and CI/CD"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Gunjan Rajgure" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "optuna>=3.6",
    "mlflow>=2.15",
    "dvc>=3.50",
    "evidently>=0.4",
    "pandera>=0.20",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ml_pipeline"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: tests that need running external services (deselect with '-m \"not integration\"')",
]
