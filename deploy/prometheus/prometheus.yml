global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API inside docker compose
  - job_name: readmission-api
    static_configs:
      - targets: ["api:8020"]
        labels: {deployment: compose}
  # API on the host (`make serve`)
  - job_name: readmission-api-host
    static_configs:
      - targets: ["host.docker.internal:8020"]
        labels: {deployment: host}
