# Local stack: API (champion bundle) + Prometheus + Grafana. MLflow UI: `make mlflow-ui`.
#   make bundle && docker compose up --build
# Ports avoid 01-llm-gateway (9090/3000) and 02-healthcare-rag (9091/3001).
services:
  api:
    build: .
    ports: ["8020:8020"]
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_BUNDLE: /app/model_bundle
    volumes:
      - api-logs:/app/logs
      - ./reports:/app/reports

  # Drift check over the API's inference log: `docker compose run --rm monitor`
  monitor:
    build: .
    profiles: ["jobs"]
    command: ["python", "-m", "ml_pipeline.monitor"]
    environment:
      MODEL_BUNDLE: /app/model_bundle
    volumes:
      - api-logs:/app/logs
      - ./reports:/app/reports

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9092:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3002:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      retries: 10

volumes:
  api-logs:
  prometheus-data:
  grafana-data:
